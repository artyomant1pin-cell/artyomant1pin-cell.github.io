<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Официальная страница приложения fortuna">
  <title>fortuna</title>
  <style>
    :root { color-scheme: dark; --bg: #10131a; --panel: #191e28; --text: #edf2f7; --muted: #a9b3c2; --line: #2d3543; --accent: #8bd3c7; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--text); font: 16px/1.6 system-ui, sans-serif; }
    main { width: min(620px, 100%); padding: clamp(28px, 7vw, 56px); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
    h1 { margin: 0 0 12px; font-size: clamp(2.4rem, 8vw, 4rem); line-height: 1; letter-spacing: -.04em; }
    p { margin: 0 0 24px; color: var(--muted); }
    nav { display: flex; gap: 18px; flex-wrap: wrap; }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>fortuna</h1>
    <p>fortuna — приложение для персональных функций и сервисов, доступных после безопасного входа через OAuth.</p>
    <nav><a href="privacy.html">Политика конфиденциальности</a><a href="tos.html">Условия использования</a></nav>
  </main>
</body>
</html>
